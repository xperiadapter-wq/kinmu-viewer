<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>勤務表（スマホ表示）</title>
<style>
  :root{--bg:#f4f6f8;--ink:#222;--sub:#666;--line:#cfd8dc;}
  @media (prefers-color-scheme: dark){:root{--bg:#15191c;--ink:#eceff1;--sub:#9aa5ab;--line:#37474f;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;font-size:15px;}
  header{padding:12px 14px 6px;}
  h1{margin:0;font-size:18px;}
  .sub{color:var(--sub);font-size:12px;margin-top:2px;}
  .bar{display:flex;gap:8px;align-items:center;padding:6px 14px;flex-wrap:wrap;}
  select{font-size:16px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;color:#222;}
  .tabs{display:flex;gap:6px;}
  .tab{font-size:14px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#222;}
  .tab.on{background:#1565c0;color:#fff;border-color:#1565c0;font-weight:bold;}
  #err{margin:14px;padding:12px;background:#ffebee;color:#b71c1c;border-radius:8px;display:none;}
  /* カレンダー */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:6px 8px 10px;}
  .dh{text-align:center;font-size:12px;font-weight:bold;padding:4px 0;}
  .dh.sun{color:#c62828}.dh.sat{color:#1565c0}
  .cell{min-height:64px;border-radius:8px;padding:3px 3px 4px;background:#fff;color:#222;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:space-between;}
  .cell .d{font-size:12px;align-self:flex-start;opacity:.8}
  .cell .c{font-size:15px;font-weight:bold;text-align:center;line-height:1.15;word-break:keep-all;}
  .cell.empty{background:transparent;border:none}
  .cell.today{outline:3px solid #ff9800;}
  /* 全員表 */
  .wrap{overflow:auto;max-height:calc(100vh - 150px);margin:4px 0 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;color:#222}
  table{border-collapse:separate;border-spacing:0;font-size:13px;}
  th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px;text-align:center;white-space:nowrap;min-width:42px;}
  thead th{position:sticky;top:0;background:#eceff1;z-index:2;font-size:12px;}
  thead th.sun{color:#c62828;background:#ffebee}thead th.sat{color:#1565c0;background:#e3f2fd}
  th.nm,td.nm{position:sticky;left:0;background:#eceff1;z-index:3;text-align:left;min-width:74px;font-weight:bold;}
  thead th.nm{z-index:4}
  tr.me td.nm{background:#ffe082}
  td.today{box-shadow:inset 0 0 0 2px #ff9800}
  .sum{padding:6px 14px;color:var(--sub);font-size:13px;line-height:1.7}
  .legend{display:flex;flex-wrap:wrap;gap:4px;padding:4px 12px 16px;}
  .legend span{font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:#222}
  /* 勤務の色（アプリと同じ） */
  .k当遅{background:#ffab91;font-weight:bold}.k明,.k代休{background:#fff59d;font-weight:bold}.k公{background:#e0e0e0;color:#777}
  .k有給,.k有給AM,.k有給PM{background:#f0f4c3;font-weight:bold}.kRC日,.kRCmaru{background:#bbdefb}.kRC遅,.kRC遅2{background:#90caf9}
  .kRCmaru,.kRC遅2,.kA2{font-weight:bold;text-decoration:underline}
  .kF8{background:#d1c4e9}.kH4{background:#b2dfdb}.kF6{background:#c5e1a5}.kA勤{background:#ffe082}.k出張{background:#d7ccc8}.k希{background:#f8bbd0}
</style>
</head>
<body>
<header><h1 id="ttl">勤務表</h1><div class="sub" id="sub"></div></header>
<div id="err"></div>
<div class="bar" id="bar" style="display:none">
  <div class="tabs"><button class="tab" id="tMine">自分の勤務</button><button class="tab on" id="tAll">全員の勤務表</button></div>
  <select id="who"></select>
  <button class="tab" id="btnPdfView">PDFを表示</button><button class="tab" id="btnPdfDl">PDFを保存</button>
</div>
<div id="mine"></div>
<div id="all" style="display:none"></div>
<div class="sum" id="sumInfo"></div>
<div class="legend" id="legend"></div>
<script>
// QRに入っているデータ（URLの # より後ろ）だけを使って表示する。サーバーには送られない。
const CODES=['','HP','A2','A勤','RC日','RC遅','RC遅2','RCmaru','F8','H4','F6','当遅','明','代休','有給','有給AM','有給PM','公','希','出張'];
const DISP={'当遅':'当(遅)','HP':'A','A勤':'A(土)','明':'代','代休':'代','有給':'有休','有給AM':'有休AM','有給PM':'有休PM','RC遅2':'RC遅*','RCmaru':'RC〇','A2':'A*'};
const disp=c=>DISP[c]||c;
const LEG=['HP','A2','RC日','RC遅','RCmaru','RC遅2','F8','H4','F6','当遅','A勤','出張','有給','明','公','希'];
const DOW='日月火水木金土';
const $=id=>document.getElementById(id);
function b64urlDecode(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='='; const bin=atob(s); const u=Uint8Array.from(bin,c=>c.charCodeAt(0)); return new TextDecoder('utf-8').decode(u); }
function parse(){
  const h=location.hash.replace(/^#/,''); if(!h)throw new Error('データがありません。勤務表のQRコードを読み取ってください。');
  const t=b64urlDecode(h).split('~');
  if(t[0]!=='1'&&t[0]!=='2')throw new Error('QRコードの形式が新しい（または古い）ようです。最新の勤務表アプリのQRを読み取ってください。');
  const year=+t[1],month=+t[2],days=+t[3],hol=t[4];
  const me=t[0]==='2'?+t[5]:-1;
  const staff=t.slice(t[0]==='2'?6:5).filter(Boolean).map(x=>{const i=x.indexOf(':');const name=x.slice(0,i),cells=x.slice(i+1);return {name,cells:[...cells].map(ch=>ch==='.'?'':(CODES[ch.charCodeAt(0)-97]||''))};});
  return {year,month,days,hol,staff,me};
}
let D,who=0,mode='all';
const today=new Date();
const isToday=d=>today.getFullYear()===D.year&&today.getMonth()+1===D.month&&today.getDate()===d;
const dowOf=d=>new Date(D.year,D.month-1,d).getDay();
function renderMine(){
  const p=D.staff[who]; let h='<div class="cal">';
  for(let i=0;i<7;i++)h+=`<div class="dh ${i==0?'sun':i==6?'sat':''}">${DOW[i]}</div>`;
  const first=dowOf(1); for(let i=0;i<first;i++)h+='<div class="cell empty"></div>';
  for(let d=1;d<=D.days;d++){
    const c=p.cells[d-1]||''; const holy=D.hol[d-1]==='1';
    h+=`<div class="cell k${c} ${isToday(d)?'today':''}"><div class="d" style="${(dowOf(d)===0||holy)?'color:#c62828':dowOf(d)===6?'color:#1565c0':''}">${d}</div><div class="c">${c?disp(c):''}</div></div>`;
  }
  $('mine').innerHTML=h+'</div>';
  const cnt={}; p.cells.forEach(c=>{ if(c)cnt[c]=(cnt[c]||0)+1; });
  const yk=(cnt['有給']||0)+(cnt['有給AM']||0)+(cnt['有給PM']||0);
  $('sumInfo').textContent=`${p.name}：公 ${cnt['公']||0}日 ／ 代 ${(cnt['明']||0)+(cnt['代休']||0)}日 ／ 有休 ${yk}日`;
}
function renderAll(){
  let h='<div class="wrap"><table><thead><tr><th class="nm">名前</th>';
  for(let d=1;d<=D.days;d++){const w=dowOf(d),holy=D.hol[d-1]==='1';h+=`<th class="${(w===0||holy)?'sun':w===6?'sat':''}">${d}<br>${DOW[w]}</th>`;}
  h+='</tr></thead><tbody>';
  D.staff.forEach((p,i)=>{ h+=`<tr class="${i===who?'me':''}"><td class="nm">${p.name}</td>`;
    for(let d=1;d<=D.days;d++){const c=p.cells[d-1]||'';h+=`<td class="k${c} ${isToday(d)?'today':''}">${c?disp(c):''}</td>`;}
    h+='</tr>'; });
  $('all').innerHTML=h+'</tbody></table></div>';
  $('sumInfo').textContent='横にスクロールすると日付が進みます。自分の行は黄色です。';
}
function render(){ $('mine').style.display=mode==='mine'?'block':'none'; $('all').style.display=mode==='all'?'block':'none'; $('tMine').classList.toggle('on',mode==='mine'); $('tAll').classList.toggle('on',mode==='all'); $('who').style.display=(D.me>=0)?'none':'inline-block'; if(mode==='mine')renderMine(); else renderAll(); }

// ===== PDF生成（スマホ内で作成。外部送信なし）=====
const BG={'当遅':'#ffab91','明':'#fff59d','代休':'#fff59d','公':'#e0e0e0','有給':'#f0f4c3','有給AM':'#f0f4c3','有給PM':'#f0f4c3','RC日':'#bbdefb','RCmaru':'#bbdefb','RC遅':'#90caf9','RC遅2':'#90caf9','F8':'#d1c4e9','H4':'#b2dfdb','F6':'#c5e1a5','A勤':'#ffe082','出張':'#d7ccc8','希':'#f8bbd0'};
const FONT='"Hiragino Sans","Yu Gothic","Noto Sans CJK JP","Noto Sans JP",sans-serif';
const PW=2526,PH=1785; // A4横 (842x595pt) の3倍
function newCanvas(){const c=document.createElement('canvas');c.width=PW;c.height=PH;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,PW,PH);x.textBaseline='middle';return [c,x];}
function cellBox(x,px,py,w,h,code,txt,opt){
  opt=opt||{}; x.fillStyle=opt.bg||BG[code]||'#fff'; x.fillRect(px,py,w,h);
  x.strokeStyle='#90a4ae'; x.lineWidth=1.5; x.strokeRect(px,py,w,h);
  if(txt){ x.fillStyle=opt.color||(code==='公'?'#777':'#222'); x.font=(opt.bold||/^(RCmaru|RC遅2|A2|当遅|明|代休|有給|A勤)/.test(code)?'bold ':'')+(opt.size||26)+'px '+FONT; x.textAlign='center';
    x.fillText(txt,px+w/2,py+h/2); if(/^(RCmaru|RC遅2|A2)$/.test(code)){const m=x.measureText(txt).width;x.fillRect(px+w/2-m/2,py+h/2+(opt.size||26)*0.55,m,2);} }
}
function pageAll(){
  const [c,x]=newCanvas(); const mT=70,mL=50;
  x.fillStyle='#222'; x.textAlign='left'; x.font='bold 44px '+FONT; x.fillText(`${D.year}年${D.month}月 勤務表`,mL,mT-10);
  const n=D.days, nmW=150, top=mT+40, hdrH=70;
  const cw=Math.floor((PW-mL*2-nmW)/n), rh=Math.min(92,Math.floor((PH-top-hdrH-230)/D.staff.length));
  cellBox(x,mL,top,nmW,hdrH,'','名前',{bg:'#eceff1',bold:true,size:28});
  for(let d=1;d<=n;d++){const w=dowOf(d),holy=D.hol[d-1]==='1';const col=(w===0||holy)?'#c62828':w===6?'#1565c0':'#222';
    cellBox(x,mL+nmW+(d-1)*cw,top,cw,hdrH,'','',{bg:(w===0||holy)?'#ffebee':w===6?'#e3f2fd':'#eceff1'});
    x.fillStyle=col;x.textAlign='center';x.font='bold 28px '+FONT;x.fillText(d,mL+nmW+(d-1)*cw+cw/2,top+24);x.font='22px '+FONT;x.fillText(DOW[w],mL+nmW+(d-1)*cw+cw/2,top+52);}
  D.staff.forEach((p,i)=>{const y=top+hdrH+i*rh;
    cellBox(x,mL,y,nmW,rh,'',p.name,{bg:i===who?'#ffe082':'#eceff1',bold:true,size:28});
    for(let d=1;d<=n;d++){const code=p.cells[d-1]||'';cellBox(x,mL+nmW+(d-1)*cw,y,cw,rh,code,code?disp(code):'',{size:cw<66?22:26});}});
  const ly=top+hdrH+D.staff.length*rh+50; let lx=mL; x.textAlign='left';
  LEG.forEach(cd=>{const tx=disp(cd);x.font='24px '+FONT;const w=x.measureText(tx).width+30;cellBox(x,lx,ly,w,40,cd,'',{});x.fillStyle='#222';x.textAlign='center';x.fillText(tx,lx+w/2,ly+20);lx+=w+10;});
  x.fillStyle='#666';x.textAlign='left';x.font='24px '+FONT;x.fillText('※QRコード読み取り時点の内容です。変更があった場合は新しいQRを読み取ってください。',mL,PH-40);
  return c;
}
function pageMine(){
  const [c,x]=newCanvas(); const p=D.staff[who],mL=60,mT=80;
  x.fillStyle='#222';x.textAlign='left';x.font='bold 48px '+FONT;x.fillText(`${p.name}　${D.year}年${D.month}月 勤務`,mL,mT);
  const first=dowOf(1), rows=Math.ceil((first+D.days)/7), top=mT+60, hdr=56, cw=Math.floor((PW-mL*2)/7), ch=Math.min(250,Math.floor((PH-top-hdr-190)/rows));
  for(let i=0;i<7;i++){cellBox(x,mL+i*cw,top,cw,hdr,'','',{bg:i===0?'#ffebee':i===6?'#e3f2fd':'#eceff1'});x.fillStyle=i===0?'#c62828':i===6?'#1565c0':'#222';x.textAlign='center';x.font='bold 30px '+FONT;x.fillText(DOW[i],mL+i*cw+cw/2,top+hdr/2);}
  for(let d=1;d<=D.days;d++){const idx=first+d-1,r=Math.floor(idx/7),col=idx%7,px=mL+col*cw,py=top+hdr+r*ch,code=p.cells[d-1]||'',holy=D.hol[d-1]==='1';
    cellBox(x,px,py,cw,ch,code,'',{});
    x.textAlign='left';x.font='bold 28px '+FONT;x.fillStyle=(col===0||holy)?'#c62828':col===6?'#1565c0':'#222';x.fillText(d,px+12,py+26);
    if(code){x.textAlign='center';x.font='bold 50px '+FONT;x.fillStyle=code==='公'?'#777':'#222';x.fillText(disp(code),px+cw/2,py+ch*0.62);}}
  const cnt={};p.cells.forEach(cd=>{if(cd)cnt[cd]=(cnt[cd]||0)+1;});const yk=(cnt['有給']||0)+(cnt['有給AM']||0)+(cnt['有給PM']||0);
  x.fillStyle='#222';x.textAlign='left';x.font='28px '+FONT;x.fillText(`公 ${cnt['公']||0}日 ／ 代 ${(cnt['明']||0)+(cnt['代休']||0)}日 ／ 有休 ${yk}日`,mL,PH-90);
  x.fillStyle='#666';x.font='22px '+FONT;x.fillText('※QRコード読み取り時点の内容です。変更があった場合は新しいQRを読み取ってください。',mL,PH-45);
  return c;
}
function makePdf(canvases){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=u=>{parts.push(u);len+=u.length;};
  const str=s=>push(enc.encode(s));
  const objStart=()=>offs.push(len);
  str('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const n=canvases.length;
  objStart();str('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  objStart();str('2 0 obj\n<< /Type /Pages /Kids ['+canvases.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] /Count '+n+' >>\nendobj\n');
  canvases.forEach((cv,i)=>{
    const b=3+i*3;
    const data=atob(cv.toDataURL('image/jpeg',0.92).split(',')[1]);const jpg=Uint8Array.from(data,ch=>ch.charCodeAt(0));
    objStart();str(`${b} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 842 595] /Resources << /XObject << /Im0 ${b+2} 0 R >> >> /Contents ${b+1} 0 R >>\nendobj\n`);
    const cs='q 842 0 0 595 0 0 cm /Im0 Do Q';
    objStart();str(`${b+1} 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
    objStart();str(`${b+2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);str('\nendstream\nendobj\n');
  });
  const xr=len,total=offs.length+1;
  str(`xref\n0 ${total}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join(''));
  str(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF\n`);
  const out=new Uint8Array(len);let p=0;parts.forEach(u=>{out.set(u,p);p+=u.length;});
  return new Blob([out],{type:'application/pdf'});
}
function pdfBlob(){ return makePdf([pageAll(),pageMine()]); }
function pdfName(){ return `勤務表_${D.year}年${D.month}月_${D.staff[who].name.replace(/^[^぀-鿿]*/,'')}.pdf`; }
$('btnPdfDl').onclick=()=>{ try{ const u=URL.createObjectURL(pdfBlob()); const a=document.createElement('a'); a.href=u; a.download=pdfName(); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000);}catch(e){alert('PDFの作成に失敗しました：'+e.message);} };
$('btnPdfView').onclick=()=>{ try{ const u=URL.createObjectURL(pdfBlob()); const w=window.open(u,'_blank'); if(!w)location.href=u; }catch(e){alert('PDFの作成に失敗しました：'+e.message);} };
try{
  D=parse();
  $('ttl').textContent=`${D.year}年${D.month}月 勤務表`; $('sub').textContent='※このQRを読み取った時点の内容です。変更があった場合は新しいQRを読み取ってください。';
  const sel=$('who'); D.staff.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p.name;sel.appendChild(o);});
  try{ const sv=localStorage.getItem('kinmu_me'); if(sv!==null&&D.staff[+sv]){who=+sv;mode='mine';} }catch(e){}
  if(D.me>=0&&D.staff[D.me]){who=D.me;mode='mine';}
  sel.value=who; sel.onchange=()=>{who=+sel.value; try{localStorage.setItem('kinmu_me',who);}catch(e){} render();};
  $('tMine').onclick=()=>{mode='mine';render();}; $('tAll').onclick=()=>{mode='all';render();};
  $('bar').style.display='flex';
  $('legend').innerHTML=LEG.map(c=>`<span class="k${c}">${disp(c)}</span>`).join('');
  render();
}catch(e){ $('err').style.display='block'; $('err').textContent=e.message; }
</script>
</body>
</html>
